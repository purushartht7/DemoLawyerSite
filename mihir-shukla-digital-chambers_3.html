<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mihir Shukla — Advocate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --navy:#0E1B33;
  --navy-2:#141F38;
  --navy-deep:#0A1428;
  --gold:#AD8A4E;
  --gold-light:#DCC48F;
  --ivory:#FAF6EC;
  --ivory-dim:#F1E9D6;
  --ink:#191712;
  --grey:#726C5F;
  --grey-light:#948E7E;
  --line:#E4DBC2;
  --line-dark:rgba(255,255,255,.14);
  --white:#fff;
  --radius:2px;
  --serif:'Fraunces', Georgia, serif;
  --sans:'Inter', -apple-system, sans-serif;
  --gutter:20px;
  --sp-sec: 36px;
  --sp-lg: 44px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--sans);
  background:var(--ivory);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:64px;
  overflow-x:hidden;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}
::selection{background:var(--gold-light);}

.eyebrow{
  font-family:var(--sans);
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:600;
}
.eyebrow.on-dark{color:var(--gold-light);}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;color:var(--navy);line-height:1.14;letter-spacing:-.01em;}
.container{max-width:520px;margin:0 auto;padding:0 var(--gutter);}
@media(min-width:900px){
  :root{
    --gutter:24px;
    --sp-sec: 56px;
    --sp-lg: 72px;
  }
  .container{max-width:1120px;padding:0 48px;}
}
section{padding:var(--sp-sec) 0;}
section.lg{padding:var(--sp-lg) 0;}

.hairline{height:1px;background:var(--line);border:0;}
.hairline.dark{background:var(--line-dark);}

/* buttons + links */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:16px 28px;font-size:13.5px;font-weight:600;letter-spacing:.02em;
  border-radius:var(--radius);transition:all .15s ease; white-space:nowrap;
}
.btn-primary{background:var(--navy);color:var(--ivory);}
.btn-primary:active{background:var(--navy-2);}
.btn-gold{background:var(--gold);color:var(--navy-deep);}
.btn-outline{border:1px solid var(--navy);color:var(--navy);}
.btn-outline-light{border:1px solid rgba(250,246,236,.4);color:var(--ivory);}
.btn-block{width:100%;}
.btn-sm{padding:12px 18px;font-size:12.5px;}

.text-link{
  display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--gold);
  border-bottom:1px solid transparent;
}
.text-link.dark{color:var(--gold-light);}
.text-link.navy{color:var(--navy);}
.text-link .arrow{transition:transform .15s;}

/* ============ SECTION HEAD PATTERN ============ */
.sec-head{margin-bottom:20px;}
.sec-head .eyebrow{display:block;margin-bottom:8px;}
.sec-head h2{font-size:26px;}
.sec-head p{color:var(--grey);font-size:14px;margin-top:10px;max-width:38ch;line-height:1.6;}
@media(min-width:900px){
  .sec-head{margin-bottom:30px;}
  .sec-head .eyebrow{margin-bottom:14px;}
  .sec-head h2{font-size:38px;}
  .sec-head p{font-size:14.5px;margin-top:14px;}
}

/* ============ HEADER ============ */
header.site{
  position:sticky;top:0;z-index:40;background:rgba(250,246,236,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.header-row{display:flex;align-items:center;justify-content:space-between;padding:16px var(--gutter);}
.brand .name{font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--navy);letter-spacing:.01em;}
.brand .role{font-size:9.5px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;font-weight:600;margin-top:1px;}
.hamburger{width:36px;height:36px;display:flex;flex-direction:column;justify-content:center;gap:5px;align-items:center;}
.hamburger span{width:19px;height:1.5px;background:var(--navy);display:block;}
.desktop-nav{display:none;}
@media(min-width:900px){
  .hamburger{display:none;}
  .desktop-nav{display:flex;gap:24px;align-items:center;font-size:13px;font-weight:500;}
  .desktop-nav a:not(.btn){color:var(--navy);}
  .desktop-nav .btn{padding:12px 22px;}
}

/* drawer */
.drawer-backdrop{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;}
.drawer-backdrop.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:82%;max-width:340px;background:var(--ivory);z-index:61;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);padding:28px var(--gutter) 40px;overflow-y:auto;}
.drawer.open{transform:translateX(0);}
.drawer-close{width:36px;height:36px;font-size:22px;color:var(--navy);}
.drawer nav{margin-top:32px;display:flex;flex-direction:column;}
.drawer nav a{padding:16px 0;border-bottom:1px solid var(--line);font-size:16px;font-family:var(--serif);color:var(--navy);}
.drawer .actions{margin-top:28px;display:flex;flex-direction:column;gap:10px;}

/* ============ HERO ============ */
.hero{background:var(--ivory);}
.hero-copy{padding:24px var(--gutter) 0;}
.hero-copy .eyebrow{margin-bottom:12px;}
.hero-copy h1{font-size:32px;letter-spacing:-.015em;}
.hero-copy p.lead{color:var(--grey);font-size:14.5px;margin-top:12px;max-width:40ch;line-height:1.6;}
.hero-btns{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-top:20px;}
.hero-media{margin-top:20px;position:relative;height:40vh;min-height:260px;overflow:hidden;}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:top center;filter:saturate(.92) contrast(1.03);}
.hero-media::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,27,51,0) 60%, rgba(14,27,51,.5) 100%);}
.hero-stats{display:flex;justify-content:space-between;padding:20px var(--gutter) 4px;max-width:520px;margin:0 auto;gap:8px;}
.hero-stats .stat{text-align:left;flex:1;}
.hero-stats .num{font-family:var(--serif);font-size:20px;color:var(--navy);}
.hero-stats .label{font-size:10px;color:var(--grey);margin-top:3px;letter-spacing:.02em;line-height:1.3;}
.hero-stats .stat + .stat{border-left:1px solid var(--line);padding-left:12px;}
@media(min-width:900px){
  .hero{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;max-width:1120px;margin:0 auto;padding:40px 48px 0;gap:56px;}
  .hero-copy{padding:0;}
  .hero-copy h1{font-size:52px;}
  .hero-media{margin-top:0;height:500px;border-radius:2px;}
  .hero-stats{grid-column:1/-1;max-width:none;padding:32px 0 0;}
  .hero-stats .num{font-size:24px;}
  .hero-stats .label{font-size:11px;}
  .hero-stats .stat + .stat{padding-left:18px;}
}

/* ============ ABOUT ============ */
.about-sec .sec-head{margin-bottom:14px;}
.about-lead{font-size:14.5px;color:var(--grey);line-height:1.7;max-width:46ch;}
.about-id{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);}
.about-id .who{font-family:var(--serif);font-size:18px;color:var(--navy);}
.about-id .role{font-size:12px;color:var(--gold);letter-spacing:.04em;margin-top:2px;}
.about-id .meta{font-size:12px;color:var(--grey);margin-top:8px;}
.about-sec .text-link{margin-top:16px;}

/* ============ TRUSTED EXPERTISE ============ */
.dark-sec{
  background:linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 100%);
  color:var(--ivory);position:relative;
}
.dark-sec .sec-head p{color:#B7BFD3;}
.expertise-head{position:relative;padding-bottom:10px;}
.expertise-head h2{color:var(--ivory);font-size:32px;}
.expertise-head h2 .thin{font-weight:400;opacity:.55;display:block;font-size:14px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:6px;font-family:var(--sans);color:var(--gold-light);}
.swipe-hint{font-size:11px;letter-spacing:.14em;color:#8890A8;text-transform:uppercase;margin:12px var(--gutter) 0;text-align:left;}

.carousel{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:var(--gutter);
  padding:8px var(--gutter) 20px;margin-top:16px;-webkit-overflow-scrolling:touch;}
.carousel::-webkit-scrollbar{display:none;}
.carousel .svc{scroll-snap-align:start;flex:0 0 82%;}
@media(min-width:640px){.carousel .svc{flex:0 0 300px;}}

.svc-card{
  background:var(--navy-2);border:1px solid var(--line-dark);border-radius:var(--radius);
  padding:24px 20px;height:100%;min-height:220px;display:flex;flex-direction:column;
}
.svc-card .idx{font-family:var(--serif);font-size:13px;color:var(--gold-light);opacity:.8;}
.svc-card .cat{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8890A8;margin-top:10px;}
.svc-card h3{color:var(--ivory);font-size:20px;margin-top:6px;}
.svc-card p{color:#B7BFD3;font-size:13px;margin-top:8px;line-height:1.55;flex:1;}
.svc-card .text-link{margin-top:14px;}

/* ============ COURTS ============ */
.map-visual{
  background:var(--ivory-dim);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;
  max-width:100%;
}
.map-visual svg{width:100%;max-width:240px;height:auto;}
.court-list{}
.court-row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);gap:12px;}
.court-row:first-child{border-top:1px solid var(--line);}
.court-row .t{font-family:var(--serif);font-size:16px;color:var(--navy);}
.court-row .d{font-size:11.5px;color:var(--grey);text-align:right;max-width:55%;line-height:1.4;}

/* ============ WHY CHOOSE ============ */
.why-list{margin-top:6px;}
.why-row{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.why-row:first-child{border-top:1px solid var(--line);}
.why-row .n{font-family:var(--serif);font-size:14px;color:var(--gold);flex:0 0 24px;}
.why-row .t{font-family:var(--serif);font-size:17px;color:var(--navy);}
.why-row .d{font-size:12.5px;color:var(--grey);margin-top:4px;max-width:46ch;line-height:1.55;}

/* ============ TIMELINE ============ */
.timeline{position:relative;padding-left:24px;margin-top:8px;}
.timeline::before{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line);}
.tl-item{position:relative;padding-bottom:24px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:'';position:absolute;left:-24px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--gold);border:2px solid var(--ivory);box-shadow:0 0 0 1px var(--gold);}
.tl-item .yr{font-family:var(--serif);font-size:18px;color:var(--navy);}
.tl-item p{font-size:13px;color:var(--grey);margin-top:4px;}
.demo-note{font-size:11px;color:var(--grey-light);font-style:italic;margin-top:14px;}

/* ============ SELECTED MATTERS ============ */
.matter-row{display:block;padding:14px 0;border-bottom:1px solid var(--line);}
.matter-row:first-child{border-top:1px solid var(--line);}
.matter-row .mr-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.matter-row h3{font-size:17.5px;color:var(--navy);font-weight:500;}
.matter-row .arrow{color:var(--gold);font-size:15px;flex:0 0 auto;}
.matter-row .meta{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);margin-top:6px;}

/* ============ TESTIMONIAL ============ */
.testi-wrap{max-width:480px;}
.testi-quote{color:var(--gold);font-family:var(--serif);font-size:36px;line-height:.5;display:block;margin-bottom:8px;}
.testi-text{font-family:var(--serif);font-size:19px;color:var(--ink);line-height:1.45;}
.testi-who{margin-top:14px;font-size:12px;color:var(--grey);}
.testi-who b{color:var(--ink);font-weight:600;}
.testi-nav{display:flex;align-items:center;gap:14px;margin-top:18px;}
.testi-nav button{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--navy);}
.testi-nav .count{font-size:12px;color:var(--grey);letter-spacing:.04em;}

/* ============ INSIGHTS ============ */
.feature-article{display:block;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line);}
.feature-article .cat{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);}
.feature-article h3{font-size:22px;margin-top:10px;line-height:1.2;}
.feature-article .rt{font-size:12px;color:var(--grey);margin-top:10px;}
.article-row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);gap:12px;}
.article-row .t{font-family:var(--serif);font-size:15px;color:var(--navy);}
.article-row .meta{font-size:10.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}
.article-row .arrow{color:var(--gold);flex:0 0 auto;}

/* ============ FAQ ============ */
.faq-item{border-bottom:1px solid var(--line);}
.faq-item:first-child{border-top:1px solid var(--line);}
.faq-q{width:100%;text-align:left;padding:14px 0;display:flex;justify-content:space-between;align-items:center;font-family:var(--serif);font-size:15.5px;color:var(--navy);gap:12px;}
.faq-q .plus{font-size:18px;color:var(--gold);transition:transform .2s;flex:0 0 auto;font-family:var(--sans);font-weight:300;}
.faq-item.open .plus{transform:rotate(45deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease;font-size:13px;color:var(--grey);line-height:1.6;}
.faq-item.open .faq-a{max-height:300px;padding-bottom:14px;}

/* ============ CONSULTATION CTA ============ */
.cta-sec{background:var(--navy);color:var(--ivory);text-align:left;padding:40px 0;}
.cta-sec h2{color:var(--ivory);font-size:28px;max-width:16ch;}
.cta-sec p{color:#B7BFD3;font-size:14px;margin-top:12px;max-width:38ch;line-height:1.6;}
.cta-sec .btn{margin-top:20px;}
@media(min-width:900px){
  .cta-sec{padding:56px 0;}
  .cta-sec h2{font-size:32px;}
}

/* ============ CONTACT ============ */
.contact-id{margin-bottom:14px;}
.contact-id .who{font-family:var(--serif);font-size:18px;color:var(--navy);}
.contact-id .role{font-size:12px;color:var(--gold);letter-spacing:.04em;margin-top:2px;}
.contact-list{}
.contact-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px;}
.contact-row:first-child{border-top:1px solid var(--line);}
.contact-row .k{color:var(--grey);}
.contact-row .v{color:var(--ink);font-weight:500;text-align:right;}
.contact-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
.contact-btns .btn{padding:12px 10px;font-size:12.5px;flex:1;}
.contact-btns .btn-dir{grid-column:1/-1;}
@media(min-width:600px){
  .contact-btns{display:flex;}
  .contact-btns .btn-dir{grid-column:auto;}
}

/* ============ FOOTER ============ */
footer.site{background:var(--navy-deep);color:#9AA1B6;padding:44px 0 100px;font-size:12.5px;}
footer.site .fname{font-family:var(--serif);color:var(--ivory);font-size:18px;}
footer.site .frole{font-size:9.5px;letter-spacing:.2em;color:var(--gold-light);text-transform:uppercase;margin-top:3px;}
.foot-nav{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:24px;}
.foot-nav a{font-size:12.5px;color:#C4CADB;padding:4px 0;}
.foot-legal{margin-top:22px;padding-top:18px;border-top:1px solid var(--line-dark);font-size:10.5px;color:#727893;line-height:1.65;}
.foot-bottom{margin-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#727893;flex-wrap:wrap;gap:8px;}
.foot-bottom a{color:#9AA1B6;}

/* ============ STICKY BOTTOM BAR ============ */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--white);
  border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1.4fr;}
.bottom-bar a{padding:14px 6px;text-align:center;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bottom-bar .ic{font-size:16px;}
.bottom-bar .consult{background:var(--navy);color:var(--ivory);}
.bottom-bar .call,.bottom-bar .wa{color:var(--navy);}
@media(min-width:900px){.bottom-bar{display:none;}body{padding-bottom:0;}}

/* ============ INTERIOR PAGE HERO ============ */
.page-hero{background:var(--navy-deep);color:var(--ivory);padding:32px 0 28px;}
.page-hero .back{font-size:12px;color:var(--gold-light);display:inline-block;margin-bottom:12px;}
.page-hero h1{color:var(--ivory);font-size:24px;}
.page-hero .meta{color:#AEB5C6;font-size:12px;margin-top:10px;}

.badge-status{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:20px;}
.badge-pending{background:#F3E4BE;color:#856013;}
.badge-review{background:#DAE5F3;color:#28517F;}
.badge-confirmed{background:#D8ECDE;color:#256F49;}
.badge-info{background:#F3D9D9;color:#963333;}

.notice{background:var(--ivory-dim);border:1px solid var(--line);border-left:3px solid var(--gold);padding:12px 14px;font-size:12px;color:var(--grey);line-height:1.55;}

/* ============ FORMS ============ */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:6px;letter-spacing:.01em;}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=date],.field select,.field textarea{
  width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);color:var(--ink);font-size:14.5px;
}
.field textarea{min-height:80px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.field.error input,.field.error select,.field.error textarea{border-color:#B23A3A;}
.field .err-msg{font-size:11px;color:#B23A3A;margin-top:4px;display:none;}
.field.error .err-msg{display:block;}
.checkline{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--grey);margin-bottom:12px;line-height:1.5;}
.checkline input{margin-top:2px;width:15px;height:15px;flex:0 0 auto;}

.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.option-card{border:1px solid var(--line);background:var(--white);border-radius:var(--radius);padding:14px 12px;text-align:left;transition:all .12s;}
.option-card.wide{grid-column:1/-1;}
.option-card.selected{border-color:var(--navy);background:var(--navy);color:var(--ivory);}
.option-card .t{font-family:var(--serif);font-size:15px;}
.option-card .d{font-size:11px;color:var(--grey);margin-top:4px;}
.option-card.selected .d{color:#B9C0D2;}

/* ============ WIZARD ============ */
.wizard-wrap{min-height:calc(100vh - 60px);display:flex;flex-direction:column;}
.wizard-top{position:sticky;top:0;background:var(--ivory);z-index:30;padding:14px var(--gutter);border-bottom:1px solid var(--line);}
.wizard-steps{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.wizard-steps .num{font-size:10.5px;letter-spacing:.12em;color:var(--grey);text-transform:uppercase;}
.wizard-steps .cur{font-family:var(--serif);font-size:14.5px;color:var(--navy);}
.progress-track{height:2px;background:var(--line);}
.progress-fill{height:100%;background:var(--gold);transition:width .3s;}
.wizard-body{flex:1;padding:24px var(--gutter) 100px;max-width:560px;margin:0 auto;width:100%;}
.wizard-body h2{font-size:20px;margin-bottom:6px;}
.wizard-sub{font-size:12.5px;color:var(--grey);margin-bottom:20px;}
.wizard-nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--line);padding:12px var(--gutter);display:flex;gap:10px;z-index:30;}
.wizard-nav .btn{flex:1;}

.upload-zone{border:1.5px dashed var(--line);border-radius:var(--radius);padding:24px 14px;text-align:center;background:var(--white);}
.upload-zone .ic{font-size:22px;color:var(--gold);}
.upload-zone p{font-size:12px;color:var(--grey);margin-top:8px;}
.file-row{display:flex;align-items:center;justify-content:space-between;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;margin-top:8px;}
.file-row .fname{font-size:12.5px;font-weight:600;color:var(--ink);}
.file-row .fmeta{font-size:10.5px;color:var(--grey);margin-top:2px;}
.file-row .remove{color:#B23A3A;font-size:11.5px;font-weight:600;}
.empty-state{text-align:center;padding:24px 12px;color:var(--grey);font-size:12px;}

.slot-day h4{font-family:var(--serif);font-size:14.5px;color:var(--navy);margin-bottom:8px;}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.slot{border:1px solid var(--line);background:var(--white);padding:10px 4px;text-align:center;font-size:12px;border-radius:var(--radius);font-weight:600;color:var(--navy);}
.slot.selected{background:var(--navy);color:var(--ivory);border-color:var(--navy);}
.slot.disabled{color:#C6C1B4;background:var(--ivory-dim);text-decoration:line-through;}

.review-block{border-bottom:1px solid var(--line);padding:16px 0;}
.review-block:first-child{border-top:1px solid var(--line);}
.review-block .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.review-block .rh h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--grey);font-family:var(--sans);font-weight:600;}
.review-block .rh .edit{font-size:11.5px;color:var(--gold);font-weight:700;}
.review-block .rr{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;}
.review-block .rr .k{color:var(--grey);}
.review-block .rr .v{color:var(--ink);font-weight:500;text-align:right;max-width:60%;}

.success-wrap{text-align:center;padding:36px 16px 48px;}
.success-icon{width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--navy-deep);font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
.ref-box{background:var(--navy);color:var(--ivory);border-radius:var(--radius);padding:20px;margin:20px 0;}
.ref-box .lbl{font-size:10px;color:var(--gold-light);letter-spacing:.12em;text-transform:uppercase;}
.ref-box .val{font-family:var(--serif);font-size:24px;margin-top:6px;}

.status-timeline{margin-top:24px;}
.status-step{display:flex;gap:12px;padding-bottom:22px;position:relative;}
.status-step::before{content:'';position:absolute;left:10px;top:22px;bottom:0;width:1px;background:var(--line);}
.status-step:last-child::before{display:none;}
.status-step .dot{width:21px;height:21px;border-radius:50%;border:2px solid var(--line);background:var(--white);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--grey);}
.status-step.done .dot{background:var(--navy);border-color:var(--navy);color:var(--ivory);}
.status-step.active .dot{background:var(--gold);border-color:var(--gold);color:var(--navy-deep);}
.status-step .t{font-family:var(--serif);font-size:14.5px;color:var(--ink);}
.status-step .d{font-size:12px;color:var(--grey);margin-top:2px;}

.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 16px;gap:12px;}
.spinner{width:28px;height:28px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.hidden{display:none !important;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stack{display:grid;gap:12px;}
@media(min-width:700px){.stack.md-3{grid-template-columns:1fr 1fr 1fr;}.stack.md-2{grid-template-columns:1fr 1fr;}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

function setLanguage(lang) {

  currentLang = currentLang === 'en' ? 'hi' : 'en';

/* ============ ROUTER ============ */
function route(){
  const app = document.getElementById('app');
  updateDrawer();
  
  if (!currentLang) {
    app.innerHTML = pageLangSelect();
    document.title = "Mihir Shukla — Advocate";
    return;
  }
  
  document.title = currentLang === 'hi' ? 'मिहिर शुक्ला — अधिवक्ता' : 'Mihir Shukla — Advocate';
  const hash = location.hash.replace('#','') || '/';
  window.scrollTo(0,0);
  if(hash==='/') app.innerHTML = pageHome();
  else if(hash==='/about') app.innerHTML = pageAbout();
  else if(hash==='/practice-areas') app.innerHTML = pagePracticeAreas();
  else if(hash.startsWith('/practice-areas/')) app.innerHTML = pagePracticeDetail(hash.split('/')[2]);
  else if(hash==='/experience') app.innerHTML = pageExperience();
  else if(hash==='/courts') app.innerHTML = pageCourts();
  else if(hash==='/selected-matters') app.innerHTML = pageMatters();
  else if(hash.startsWith('/selected-matters/')) app.innerHTML = pageMatterDetail(hash.split('/')[2]);
  else if(hash==='/insights') app.innerHTML = pageInsights();
  else if(hash.startsWith('/insights/')) app.innerHTML = pageArticleDetail(hash.split('/')[2]);
  else if(hash==='/faq') app.innerHTML = pageFAQ();
  else if(hash==='/contact') app.innerHTML = pageContact();
  else if(hash.startsWith('/consultation/status')) app.innerHTML = pageStatus();
  else if(hash.startsWith('/consultation/success')) app.innerHTML = pageSuccess();
  else if(hash.startsWith('/consultation')) app.innerHTML = pageWizard();
  else app.innerHTML = pageHome();
}
window.addEventListener('hashchange', route);

/* ============ PAGE: WIZARD ============ */
function wizardChrome(inner, opts={}){
  const pct = Math.round((wizardStep/TOTAL_STEPS)*100);
  return `
  <div class="wizard-wrap">
    <div class="wizard-top">
      <div class="wizard-steps">
        <span class="num">${T[currentLang].wiz_step} 0${wizardStep} / 0${TOTAL_STEPS}</span>
        <span class="cur">${STEP_LABELS[currentLang][wizardStep-1]}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="wizard-body">${inner}</div>
  </div>
  <div class="wizard-nav">
    ${wizardStep>1?`<button class="btn btn-outline" onclick="wizardBack()">${T[currentLang].wiz_back}</button>`:`<a class="btn btn-outline" href="#/">${T[currentLang].wiz_cancel}</a>`}
    ${opts.customNext?opts.customNext:`<button class="btn btn-primary" onclick="wizardNext()">${T[currentLang].wiz_continue}</button>`}
  </div>`;
}

function pageWizard(){
  if(wizardStep===1) return step1();
  if(wizardStep===2) return step2();
  if(wizardStep===3) return step3();
  if(wizardStep===4) return step4();
  if(wizardStep===5) return step5();
  return step1();
}

/* STEP 1 */
function getMatterTypes() {
  return [
    {k:'criminal', t: currentLang === 'hi' ? 'आपराधिक मामला' : 'Criminal Matter'},
    {k:'civil', t: currentLang === 'hi' ? 'दीवानी विवाद' : 'Civil Dispute'},
    {k:'property', t: currentLang === 'hi' ? 'संपत्ति का मामला' : 'Property Matter'},
    {k:'family', t: currentLang === 'hi' ? 'पारिवारिक / वैवाहिक' : 'Family / Matrimonial'},
    {k:'commercial', t: currentLang === 'hi' ? 'वाणिज्यिक मामला' : 'Commercial Matter'},
    {k:'writ', t: currentLang === 'hi' ? 'संवैधानिक / रिट याचिका' : 'Constitutional / Writ'},
    {k:'other', t: currentLang === 'hi' ? 'अन्य' : 'Other'}
  ];
}

function step1(){
  const matterTypes = getMatterTypes();
  return wizardChrome(`
    <h2>${T[currentLang].wiz_s1_title}</h2>
    <div class="wizard-sub">${T[currentLang].wiz_s1_sub}</div>
    <div class="option-grid" id="matterGrid">
      ${matterTypes.map(m=>`<button class="option-card wide ${consultation.matterType===m.k?'selected':''}" data-k="${m.k}" onclick="selectMatter('${m.k}')"><div class="t">${m.t}</div></button>`).join('')}
    </div>
  `);
}

function selectMatter(k){
  consultation.matterType = k;
  document.querySelectorAll('#matterGrid .option-card').forEach(el=>el.classList.toggle('selected', el.dataset.k===k));
}

    consultation.details.court = val('f_court');

    consultation.details.stage = val('f_stage');
    consultation.details.hearing = val('f_hearing');

  if(mt==='criminal'){
    Object.assign(consultation.criminal,{nature:val('c_nature'),sections:val('c_sections'),fir:val('c_fir'),

    </div>
    <div class="checkline"><input type="checkbox" id="ct_confirm" ${c.confirm?'checked':''}><span>${T[currentLang].wiz_s4_confirm}</span></div>
    <div class="checkline"><input type="checkbox" id="ct_privacy" ${c.privacy?'checked':''}><span>${T[currentLang].wiz_s4_privacy}</span></div>
  `);
}

function validateStep3(){
  let ok = true;
  const name = val('ct_name'), mobile = val('ct_mobile');
  setErr('fld_name', name.trim().length<2);
  const mobileOk = /^[6-9]\d{9}$/.test(mobile.replace(/\D/g,''));
  setErr('fld_mobile', !mobileOk);
  if(name.trim().length<2||!mobileOk) ok=false;
  if(!document.getElementById('ct_confirm').checked || !document.getElementById('ct_privacy').checked){
    alert(T[currentLang].wiz_confirm_err);
    ok=false;
  }
  return ok;
}
function setErr(id,isErr){ const el = document.getElementById(id); if(el) el.classList.toggle('error', isErr); }

/* STEP 4 */
let selectedDay = Object.keys(SLOTS)[0];
function step4(){
  const days = Object.keys(SLOTS);
  const types = [
    {k: 'inperson', t: T[currentLang].wiz_s5_type_inperson, d: T[currentLang].wiz_s5_type_inperson_d},
    {k: 'phone', t: T[currentLang].wiz_s5_type_phone, d: T[currentLang].wiz_s5_type_phone_d},
    {k: 'video', t: T[currentLang].wiz_s5_type_video, d: T[currentLang].wiz_s5_type_video_d}
  ];
  return wizardChrome(`
    <h2>${T[currentLang].wiz_s5_title}</h2>
    <div class="wizard-sub">${T[currentLang].wiz_s5_sub}</div>
    <div class="option-grid" id="typeGrid">
      ${types.map(type=>`
        <button class="option-card ${consultation.appointment.type===type.k?'selected':''}" data-k="${type.k}" onclick="selectApptType('${type.k}')"><div class="t">${type.t}</div><div class="d">${type.d}</div></button>
      `).join('')}
    </div>
    <div class="hairline" style="margin:22px 0;"></div>
    <div class="field">
      <label>${T[currentLang].wiz_s5_date}</label>
      <select id="daySelect" onchange="changeDay()">
        ${days.map(d=>`<option value="${d}" ${selectedDay===d?'selected':''}>${currentLang === 'hi' ? d.replace('AUG', 'अगस्त') : d + ' 2026'}</option>`).join('')}
      </select>
    </div>
    <div id="slotArea">${renderSlots()}</div>
    <div class="notice" style="margin-top:18px;">${T[currentLang].wiz_s5_notice}</div>
  `);
}

function selectApptType(k){
  consultation.appointment.type = k;
  document.querySelectorAll('#typeGrid .option-card').forEach(el=>el.classList.toggle('selected', el.dataset.k===k));
}

function changeDay(){ selectedDay = document.getElementById('daySelect').value; document.getElementById('slotArea').innerHTML = renderSlots(); }

function renderSlots(){
  const slots = SLOTS[selectedDay];
  if(!slots || slots.every(s=>!s.ok)) return `<div class="empty-state">${T[currentLang].wiz_s5_no_slots}</div>`;
  const dayStr = currentLang === 'hi' ? selectedDay.replace('AUG', 'अगस्त') : selectedDay + ' 2026';
  return `<div class="slot-day"><h4>${dayStr}</h4><div class="slot-grid">
    ${slots.map(s=>`<button class="slot ${!s.ok?'disabled':''} ${consultation.appointment.date===selectedDay&&consultation.appointment.time===s.t?'selected':''}" ${s.ok?`onclick="selectSlot('${s.t}')"`:'disabled'}>${s.t}</button>`).join('')}
  </div></div>`;
}

function selectSlot(t){
  consultation.appointment.date = selectedDay;
  consultation.appointment.time = t;
  document.getElementById('slotArea').innerHTML = renderSlots();
}

/* STEP 5 */
function step5(){
  const c = consultation;
  const mtLabel = (getMatterTypes().find(m=>m.k===c.matterType)||{}).t || 'Not specified';
  return wizardChrome(`
    <h2>${T[currentLang].wiz_s6_title}</h2>
    <div class="wizard-sub">${T[currentLang].wiz_s6_sub}</div>

    <div class="review-block">
      <div class="rh"><h4>${T[currentLang].wiz_s6_matter}</h4><a class="edit" onclick="goStep(1)">${T[currentLang].wiz_s6_edit}</a></div>
      <div class="rr"><span class="k">${T[currentLang].wiz_s6_type}</span><span class="v">${mtLabel}</span></div>
    </div>

    <div class="review-block">
      <div class="rh"><h4>${T[currentLang].wiz_s6_case_details}</h4><a class="edit" onclick="goStep(2)">${T[currentLang].wiz_s6_edit}</a></div>
      <div class="rr"><span class="k">${T[currentLang].wiz_s6_desc}</span><span class="v">${trunc(c.details.desc)}</span></div>
      <div class="rr"><span class="k">${T[currentLang].wiz_s6_loc}</span><span class="v">${c.details.loc||'—'}</span></div>
      <div class="rr"><span class="k">${T[currentLang].wiz_s6_existing}</span><span class="v">${c.details.existing==='yes' ? (currentLang === 'hi' ? 'हाँ' : 'Yes') : (currentLang === 'hi' ? 'नहीं' : 'No')}</span></div>
    </div>

    <div class="review-block">
      <div class="rh"><h4>${T[currentLang].wiz_s6_contact}</h4><a class="edit" onclick="goStep(3)">${T[currentLang].wiz_s6_edit}</a></div>
      <div class="rr"><span class="k">${T[currentLang].wiz_s6_name}</span><span class="v">${c.contact.name||'—'}</span></div>
      <div class="rr"><span class="k">${T[currentLang].wiz_s6_mobile}</span><span class="v">${c.contact.mobile||'—'}</span></div>
    </div>

    <div class="review-block">
      <div class="rh"><h4>${T[currentLang].wiz_s6_appointment}</h4><a class="edit" onclick="goStep(4)">${T[currentLang].wiz_s6_edit}</a></div>
      <div class="rr"><span class="k">${T[currentLang].wiz_s6_type}</span><span class="v">${apptTypeLabel(c.appointment.type)}</span></div>
      <div class="rr"><span class="k">${T[currentLang].wiz_s6_date}</span><span class="v">${c.appointment.date ? (currentLang === 'hi' ? c.appointment.date.replace('AUG', 'अगस्त') : c.appointment.date + ' 2026') : '—'}</span></div>
      <div class="rr"><span class="k">${T[currentLang].wiz_s6_time}</span><span class="v">${c.appointment.time||'—'}</span></div>
    </div>

    <div class="notice" style="margin-top:6px;">${T[currentLang].wiz_s6_notice}</div>
  `, {customNext:`<button class="btn btn-gold" onclick="submitConsultation()">${T[currentLang].wiz_submit_request}</button>`});
}

function trunc(s){ if(!s) return '—'; return s.length>60? s.slice(0,60)+'…': s; }
function apptTypeLabel(k){
  if (currentLang === 'hi') {
    return {inperson:'व्यक्तिगत (कार्यालय)',phone:'फोन पर',video:'वीडियो कॉल'}[k] || '—';
  }
  return {inperson:'In-Person',phone:'Phone',video:'Video'}[k] || '—';
}
function goStep(n){ wizardStep = n; route(); }

/* WIZARD NAV */
function wizardNext(){
  if(wizardStep===1 && !consultation.matterType){ alert(T[currentLang].wiz_select_matter_err); return; }
  if(wizardStep===2){ saveStep2(); }
  if(wizardStep===3){
    if(!validateStep3()) return;
    consultation.contact = {name:val('ct_name'),mobile:val('ct_mobile'),city:val('ct_city'),pref:val('ct_pref'),confirm:true,privacy:true};
  }
  if(wizardStep===4){
    if(!consultation.appointment.type){ alert(T[currentLang].wiz_appt_type_err); return; }
    if(!consultation.appointment.time){ alert(T[currentLang].wiz_appt_slot_err); return; }
  }
  wizardStep = Math.min(wizardStep+1, TOTAL_STEPS);
  location.hash = '#/consultation';
  route();
}
function wizardBack(){ wizardStep = Math.max(1, wizardStep-1); route(); }

function constructWhatsAppMessage() {
  const c = consultation;
  const mtLabel = (getMatterTypes().find(m => m.k === c.matterType) || {}).t || 'Not specified';
  const dateStr = c.appointment.date ? (currentLang === 'hi' ? c.appointment.date.replace('AUG', 'अगस्त') : c.appointment.date + ' 2026') : '—';
  
  if (currentLang === 'hi') {
    let msg = `नमस्ते अधिवक्ता मिहिर शुक्ला जी,\n\nमैं कानूनी परामर्श के लिए अनुरोध करना चाहता/चाहती हूँ। विवरण इस प्रकार हैं:\n\n`;
    msg += `*मामले का विवरण:*\n`;
    msg += `• प्रकार: ${mtLabel}\n`;
    msg += `• संक्षिप्त विवरण: ${c.details.desc || '—'}\n`;
    msg += `• घटना की तिथि: ${c.details.date || '—'}\n`;
    msg += `• स्थान: ${c.details.loc || '—'}\n`;
    msg += `• लंबित मामला: ${c.details.existing === 'yes' ? 'हाँ' : 'नहीं'}\n`;
    if (c.details.existing === 'yes') {
      msg += `  - न्यायालय/मंच: ${c.details.court || '—'}\n`;
      msg += `  - केस संख्या: ${c.details.caseno || '—'}\n`;
      msg += `  - वर्तमान चरण: ${c.details.stage || '—'}\n`;
      msg += `  - अगली सुनवाई: ${c.details.hearing || '—'}\n`;
    }
    
    if (c.matterType === 'criminal') {
      const crim = c.criminal;
      msg += `\n*आपराधिक मामले का विवरण:*\n`;
      msg += `• अपराध की प्रकृति: ${crim.nature || '—'}\n`;
      msg += `• संबंधित धाराएं: ${crim.sections || '—'}\n`;
      msg += `• प्राथमिकी (FIR) दर्ज: ${crim.fir === 'yes' ? 'हाँ' : 'नहीं'}\n`;
      if (crim.fir === 'yes') {
        msg += `  - प्राथमिकी संख्या: ${crim.firno || '—'}\n`;
        msg += `  - प्राथमिकी तिथि: ${crim.firdate || '—'}\n`;
        msg += `  - थाना: ${crim.ps || '—'}\n`;
        msg += `  - जिला: ${crim.district || '—'}\n`;
      }
      msg += `• आपकी भूमिका: ${crim.role || '—'}\n`;
      msg += `• वर्तमान स्थिति: ${crim.stage || '—'}\n`;
    }
    
    msg += `\n*संपर्क विवरण:*\n`;
    msg += `• नाम: ${c.contact.name || '—'}\n`;
    msg += `• मोबाइल नंबर: ${c.contact.mobile || '—'}\n`;
    msg += `• शहर: ${c.contact.city || '—'}\n`;
    msg += `• पसंदीदा संचार माध्यम: ${c.contact.pref || '—'}\n`;
    
    msg += `\n*अपॉइंटमेंट प्राथमिकता:*\n`;
    msg += `• परामर्श प्रकार: ${apptTypeLabel(c.appointment.type)}\n`;
    msg += `• तिथि: ${dateStr}\n`;
    msg += `• समय: ${c.appointment.time || '—'}\n`;
    
    return msg;
  } else {
    let msg = `Hello Advocate Mihir Shukla,\n\nI would like to request a legal consultation. My details are as follows:\n\n`;
    msg += `*Matter Details:*\n`;
    msg += `• Type: ${mtLabel}\n`;
    msg += `• Description: ${c.details.desc || '—'}\n`;
    msg += `• Date of Incident: ${c.details.date || '—'}\n`;
    msg += `• Location: ${c.details.loc || '—'}\n`;
    msg += `• Existing Case: ${c.details.existing === 'yes' ? 'Yes' : 'No'}\n`;
    if (c.details.existing === 'yes') {
      msg += `  - Court/Forum: ${c.details.court || '—'}\n`;
      msg += `  - Case Number: ${c.details.caseno || '—'}\n`;
      msg += `  - Current Stage: ${c.details.stage || '—'}\n`;
      msg += `  - Next Hearing: ${c.details.hearing || '—'}\n`;
    }
    
    if (c.matterType === 'criminal') {
      const crim = c.criminal;
      msg += `\n*Criminal Matter Details:*\n`;
      msg += `• Nature of Offence: ${crim.nature || '—'}\n`;
      msg += `• Sections/Acts Involved: ${crim.sections || '—'}\n`;
      msg += `• FIR Registered: ${crim.fir === 'yes' ? 'Yes' : 'No'}\n`;
      if (crim.fir === 'yes') {
        msg += `  - FIR Number: ${crim.firno || '—'}\n`;
        msg += `  - FIR Date: ${crim.firdate || '—'}\n`;
        msg += `  - Police Station: ${crim.ps || '—'}\n`;
        msg += `  - District: ${crim.district || '—'}\n`;
      }
      msg += `• Your Role: ${crim.role || '—'}\n`;
      msg += `• Current Stage: ${crim.stage || '—'}\n`;
    }
    
    msg += `\n*Contact Details:*\n`;
    msg += `• Name: ${c.contact.name || '—'}\n`;
    msg += `• Mobile: ${c.contact.mobile || '—'}\n`;
    msg += `• City: ${c.contact.city || '—'}\n`;
    msg += `• Preferred Communication: ${c.contact.pref || '—'}\n`;
    
    msg += `\n*Appointment Preference:*\n`;
    msg += `• Type: ${apptTypeLabel(c.appointment.type)}\n`;
    msg += `• Date: ${dateStr}\n`;
    msg += `• Time: ${c.appointment.time || '—'}\n`;
    
    return msg;
  }
}

function submitConsultation(){
  const app = document.getElementById('app');
  app.innerHTML = header() + `<div class="loader"><div class="spinner"></div><p style="color:var(--grey);font-size:13px;">${T[currentLang].wiz_loading}</p></div>`;
  const msg = constructWhatsAppMessage();
  const encodedMsg = encodeURIComponent(msg);
  const waUrl = `https://wa.me/919415853397?text=${encodedMsg}`;
  window.open(waUrl, '_blank');
  setTimeout(()=>{
    lastRef = 'MS-2026-' + (1000+Math.floor(Math.random()*9000));
    location.hash = '#/consultation/success';
  }, 900);
}

/* SUCCESS & STATUS PAGES */
function pageSuccess(){
  const c = consultation;
  if(!lastRef) lastRef = 'MS-2026-1048';
  const dateStr = c.appointment.date ? (currentLang === 'hi' ? c.appointment.date.replace('AUG', 'अगस्त') : c.appointment.date + ' 2026') : '—';
  return header() + `
  <div class="success-wrap container">
    <div class="success-icon">&#10003;</div>
    <h1 style="font-size:24px;">${T[currentLang].suc_received}</h1>
    <p style="color:var(--grey);font-size:14px;margin-top:12px;">${T[currentLang].suc_lead}</p>
    <div class="ref-box">
      <div class="lbl">${T[currentLang].suc_ref}</div>
      <div class="val">${lastRef}</div>
      <div style="margin-top:14px;"><span class="badge-status badge-pending">${T[currentLang].suc_pending}</span></div>
    </div>
    <div class="review-block" style="text-align:left;border-top:1px solid var(--line);">
      <div class="rr"><span class="k">${T[currentLang].suc_req_date}</span><span class="v">${dateStr}</span></div>
      <div class="rr"><span class="k">${T[currentLang].suc_req_time}</span><span class="v">${c.appointment.time||'—'}</span></div>
      <div class="rr"><span class="k">${T[currentLang].suc_type}</span><span class="v">${apptTypeLabel(c.appointment.type)}</span></div>
    </div>
    <a class="btn btn-primary btn-block" href="#/consultation/status" style="margin-top:22px;">${T[currentLang].suc_btn_track}</a>
    <a class="btn btn-outline btn-block" href="#/" style="margin-top:10px;">${T[currentLang].suc_btn_home}</a>
  </div>` + footer();
}

function pageStatus(){
  return header() + `
  <div class="page-hero"><div class="container"><div class="eyebrow on-dark">Status</div><h1 style="margin-top:14px;">${T[currentLang].stat_title}</h1></div></div>
  <section class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line);">
      <span style="color:var(--grey);font-size:13px;">${T[currentLang].suc_ref}</span><span style="font-weight:700;font-family:var(--serif);font-size:16px;">${lastRef||'MS-2026-1048'}</span>
    </div>
    <div style="margin-top:16px;"><span class="badge-status badge-pending">${T[currentLang].suc_pending}</span></div>

    <div class="status-timeline">
      <div class="status-step done"><div class="dot">&#10003;</div><div><div class="t">${T[currentLang].stat_step1_t}</div><div class="d">${T[currentLang].stat_step1_d}</div></div></div>
      <div class="status-step active"><div class="dot">&#8226;</div><div><div class="t">${T[currentLang].stat_step2_t}</div><div class="d">${T[currentLang].stat_step2_d}</div></div></div>
      <div class="status-step"><div class="dot"></div><div><div class="t">${T[currentLang].stat_step3_t}</div><div class="d">${T[currentLang].stat_step3_d}</div></div></div>
      <div class="status-step"><div class="dot"></div><div><div class="t">${T[currentLang].stat_step4_t}</div><div class="d">${T[currentLang].stat_step4_d}</div></div></div>
    </div>
    <div class="notice" style="margin-top:8px;">${T[currentLang].stat_notice}</div>
    <a class="btn btn-outline btn-block" href="#/" style="margin-top:20px;">${T[currentLang].suc_btn_home}</a>
  </section>` + footer() + bottomBar();
}

/* ============ INIT ============ */
route();
</script>
</body>
</html>
